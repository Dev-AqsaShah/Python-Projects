<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aqsa AI Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Space Grotesk', sans-serif; }

  .aurora-bg {
    background: radial-gradient(circle at 15% 20%, rgba(124,58,237,0.35), transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(236,72,153,0.30), transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(34,211,238,0.25), transparent 45%),
                #05050a;
    background-size: 200% 200%;
    animation: drift 18s ease-in-out infinite;
  }
  @keyframes drift {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }

  #chat-box::-webkit-scrollbar { width: 6px; }
  #chat-box::-webkit-scrollbar-thumb { background: #6d28d9; border-radius: 10px; }
  #chat-box::-webkit-scrollbar-track { background: transparent; }

  .typing-dot { animation: blink 1.4s infinite both; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-in { animation: fadeInUp 0.25s ease-out; }

  .glow-btn { box-shadow: 0 0 20px rgba(168,85,247,0.55); }
  .glow-btn:hover { box-shadow: 0 0 28px rgba(236,72,153,0.65); }

  .glass {
    background: rgba(17, 17, 27, 0.65);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body class="aurora-bg min-h-screen flex items-center justify-center p-4 text-gray-100">

  <div class="w-full max-w-2xl h-[88vh] glass rounded-3xl shadow-2xl flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="flex items-center gap-3 px-6 py-4 border-b border-white/10 bg-white/[0.03]">
      <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-br from-fuchsia-500 via-purple-500 to-cyan-400 flex items-center justify-center text-xl shadow-lg">
        🪐
        <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 rounded-full border-2 border-[#11111b]"></span>
      </div>
      <div>
        <h1 class="font-semibold text-lg leading-tight bg-gradient-to-r from-fuchsia-400 via-purple-300 to-cyan-300 bg-clip-text text-transparent">Aqsa AI Chatbot</h1>
        <p class="text-xs text-gray-400">Online · Powered by Gemini</p>
      </div>
    </div>

    <!-- Chat messages -->
    <div id="chat-box" class="flex-1 overflow-y-auto px-4 py-5 space-y-4">
      <div class="flex justify-start msg-in">
        <div class="max-w-[75%] bg-white/[0.06] border border-white/10 text-gray-100 px-4 py-3 rounded-2xl rounded-bl-sm text-sm">
          👋 Hey! I'm Aqsa AI Chatbot. Ask me anything to get started.
        </div>
      </div>
    </div>

    <!-- Input area -->
    <form id="chat-form" class="flex items-center gap-2 p-4 border-t border-white/10 bg-white/[0.03]">
      <input id="user-input" type="text" autocomplete="off" placeholder="Type your message..."
        class="flex-1 px-4 py-3 rounded-full bg-white/[0.06] border border-white/10 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-fuchsia-500/60 text-sm" />
      <button type="submit" class="w-12 h-12 flex items-center justify-center rounded-full bg-gradient-to-br from-fuchsia-500 to-cyan-400 text-white glow-btn transition">
        ➤
      </button>
    </form>
  </div>

<script>
  const chatBox = document.getElementById('chat-box');
  const chatForm = document.getElementById('chat-form');
  const userInput = document.getElementById('user-input');

  function addMessage(text, sender) {
    const wrapper = document.createElement('div');
    wrapper.className = `flex msg-in ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

    const bubble = document.createElement('div');
    bubble.className = sender === 'user'
      ? 'max-w-[75%] bg-gradient-to-br from-fuchsia-600 to-purple-600 text-white px-4 py-3 rounded-2xl rounded-br-sm shadow-lg text-sm whitespace-pre-wrap'
      : 'max-w-[75%] bg-white/[0.06] border border-white/10 text-gray-100 px-4 py-3 rounded-2xl rounded-bl-sm text-sm whitespace-pre-wrap';
    bubble.textContent = text;

    wrapper.appendChild(bubble);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    const wrapper = document.createElement('div');
    wrapper.className = 'flex justify-start msg-in';
    wrapper.id = 'typing-indicator';
    wrapper.innerHTML = `
      <div class="bg-white/[0.06] border border-white/10 px-4 py-3 rounded-2xl rounded-bl-sm flex gap-1 items-center">
        <span class="typing-dot w-2 h-2 bg-fuchsia-400 rounded-full"></span>
        <span class="typing-dot w-2 h-2 bg-purple-400 rounded-full"></span>
        <span class="typing-dot w-2 h-2 bg-cyan-400 rounded-full"></span>
      </div>`;
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function askGemini(message) {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData?.error || `Request failed (${res.status})`);
    }
    const data = await res.json();
    return data?.reply || 'Sorry, I could not generate a response.';
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = userInput.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    userInput.value = '';
    addTypingIndicator();

    try {
      const reply = await askGemini(message);
      removeTypingIndicator();
      addMessage(reply, 'bot');
    } catch (err) {
      removeTypingIndicator();
      addMessage('Error: ' + err.message, 'bot');
    }
  });
</script>
</body>
</html>
